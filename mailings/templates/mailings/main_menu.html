<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Рассылки</h5>
    <nav class="ms-5">
        <a href="{% url 'mailings:home' %}" class="p-2 btn btn-outline-primary">Главная</a>
        <a href="{% url 'mailings:recipients' %}" class="p-2 btn btn-outline-primary">Получатели</a>
        <a href="{% url 'mailings:messages' %}" class="p-2 btn btn-outline-primary">Сообщения</a>
        <a href="{% url 'mailings:mailing' %}" class="p-2 btn btn-outline-primary">Рассылки</a>

        {% if user.is_authenticated %}
            <form action="{% url 'users:logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="p-2 btn btn-outline-primary">Выйти</button>
            </form>
        {% else %}
            <a href="{% url 'users:register' %}" class="p-2 btn btn-outline-primary">Регистрация</a>
            <a href="{% url 'users:login' %}" class="p-2 btn btn-outline-primary">Войти</a>
        {% endif %}
    </nav>
</div>
